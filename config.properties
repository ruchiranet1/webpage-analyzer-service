# config.properties
# Default configuration for the Web Page Analyzer

# --- HTTP Server ---
http.port=8080
http.shutdown.timeout=30s

# --- JWT ---
jwt.secret=my-super-secret-key-change-me
jwt.token.ttl=100h

# --- Rate Limiter ---
rate.limiter.rps=10
rate.limiter.burst=20

# --- Middleware ---
idempotency.ttl=5m

# --- Services ---
fetcher.timeout=10s
link.checker.timeout=5s

# --- Logging ---
logger.level=debug